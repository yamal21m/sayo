name: Auto Update SAYO Data

on:
  schedule:
    # 하루 3번 자동 실행 (한국시간 오전 7시, 오후 4시, 밤 11시)
    - cron: '0 22 * * *'
    - cron: '0 7 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch: # 언제든 수동으로 즉시 실행할 수 있는 버튼 활성화

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free libraries
        run: pip install yfinance

      - name: Run data collector
        run: python update_data.py

      - name: Save and push updated data.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto update market data"
          git push
